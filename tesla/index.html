<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Estilo Tesla</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 20px; font-weight: 300; letter-spacing: 2px; }
        .grid-camaras {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        .contentor-camara {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid #333;
        }
        video {
            width: 100%;
            height: auto;
            border-radius: 8px;
            background: #000;
            transform: scaleX(-1);
        }
        .btn-executar {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 18px;
            background-color: #e81123;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(232, 17, 35, 0.4);
            text-decoration: none;
            display: inline-block;
        }
        .btn-executar:hover { background-color: #ff1a2e; transform: scale(1.05); }
    </style>
</head>
<body>

    <h1>PAINEL DE CONTROLO TESLA</h1>

    <div class="grid-camaras">
        <div class="contentor-camara">
            <h3>Câmara Frontal</h3>
            <video id="cam-frontal" autoplay playsinline></video>
        </div>
        <div class="contentor-camara">
            <h3>Câmara Traseira</h3>
            <video id="cam-traseira" autoplay playsinline></video>
        </div>
    </div>

    <!-- O link usa o protocolo que vamos ensinar ao Windows a abrir -->
    <a href="ativar-tesla://" class="btn-executar">Ativar Sistema (.EXE)</a>

    <script>
        async function iniciarCamaras() {
            try {
                const dispositivos = await navigator.mediaDevices.enumerateDevices();
                const videoDispositivos = dispositivos.filter(device => device.kind === 'videoinput');

                if (videoDispositivos[0]) {
                    const stream1 = await navigator.mediaDevices.getUserMedia({ 
                        video: { deviceId: videoDispositivos[0].deviceId } 
                    });
                    document.getElementById('cam-frontal').srcObject = stream1;
                }

                if (videoDispositivos[1]) {
                    const stream2 = await navigator.mediaDevices.getUserMedia({ 
                        video: { deviceId: videoDispositivos[1].deviceId } 
                    });
                    document.getElementById('cam-traseira').srcObject = stream2;
                }
            } catch (erro) {
                console.error("Erro ao abrir câmaras: ", erro);
            }
        }
        window.onload = iniciarCamaras;
    </script>
</body>
</html>
